# Flatwater Research Institute — editor configuration
#
# REQUIRED before this works: replace YOUR_GITHUB_USERNAME/YOUR_REPO_NAME below
# with the actual GitHub repository this site lives in (e.g. tblakeman1960/flatwater-site).

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "camper_photos"
    label: "Camper Photos"
    files:
      - name: "camper_photos"
        label: "Camper Photos"
        file: "content/camper-photos.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Caption", name: "caption", widget: "string"}
              - {label: "Submitted by", name: "submitted_by", widget: "string", required: false}

  - name: "testimonials"
    label: "Comments"
    files:
      - name: "testimonials"
        label: "Comments"
        file: "content/testimonials.json"
        fields:
          - label: "Comments"
            name: "items"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Author or role", name: "author", widget: "string"}

  - name: "publications"
    label: "Publications"
    files:
      - name: "publications"
        label: "Publications"
        file: "content/publications.json"
        fields:
          - label: "Publications"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Type"
                name: "kind"
                widget: "select"
                options: ["Peer-reviewed article", "Methods guide", "Open dataset", "Report"]
              - {label: "Link (optional)", name: "link", widget: "string", required: false}

  - name: "settings"
    label: "Contact Info"
    files:
      - name: "settings"
        label: "Contact Info"
        file: "content/settings.json"
        fields:
          - label: "Emails"
            name: "emails"
            widget: "list"
            field: {label: "Email", name: "email", widget: "string"}
          - label: "Phone numbers"
            name: "phones"
            widget: "list"
            field: {label: "Phone", name: "phone", widget: "string"}
